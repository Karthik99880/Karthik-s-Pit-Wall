# ──────────────────────────────────────────────
#  SonarCloud Configuration — Karthik's Pit Wall
# ──────────────────────────────────────────────

sonar.projectKey=Karthik99880_Karthik-s-Pit-Wall
sonar.organization=karthik99880

sonar.projectName=Karthik's Pit Wall
sonar.projectVersion=1.0.0

# ── Source ──
sonar.sources=src
sonar.sourceEncoding=UTF-8

# ── TypeScript / JavaScript ──
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Exclusions ──
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/public/**

# ── Duplication exclusions ──
sonar.cpd.exclusions=\
  **/components/ui/**

# ── Coverage exclusions (don't penalize for no tests on these) ──
sonar.coverage.exclusions=\
  **/components/ui/**,\
  **/lib/utils.ts,\
  **/main.tsx
